  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);

      color-mix(in srgb, var(--foreground) 7%, transparent)

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);

.nav-link:focus-visible {

    &lt;p&gt;PowerOps и оба guard предполагаются включёнными. Старый global Tooz lock заменён receiving-compute guard. Host lock сохраняется; PowerOps/Tooz и guard — библиотеки внутри сервисов.&lt;/p&gt;
    &lt;p&gt;Watcher hold не отменяет уже допущенные действия и не блокирует Mistral или ручные Nova операции. Потеря lock не отменяет отправленный запрос.&lt;/p&gt;
    &lt;p&gt;Nova API, conductor и scheduler показаны отдельно. Placement, БД, RabbitMQ и внутренние вызовы Nova свёрнуты. Путь Nova уточнён по upstream 2025.1; исходники Nova-форка в архивах отсутствуют.&lt;/p&gt;
    &lt;p&gt;На хостах разделены состояние сервиса по Nova API, последнее чтение ВМ и фактический мир libvirt/QEMU. Hdst enabled/up — условие сценария, не результат нового запроса.&lt;/p&gt;
    &lt;p&gt;Размещение по архиву Kolla: hostmonitor, Ironic API и conductor — control; Consul agents также работают на compute. Локальные Consul endpoints hostmonitor и server-группы по сетям свёрнуты. BMC находится вне ОС и остаётся отдельным участником при выключении хоста.&lt;/p&gt;
    &lt;p&gt;Источник: архивы + mimaric 71b0123. Совместная сборка и deployment не подтверждены. Время условное; это иллюстрация, не результат TLC или измерение стенда.&lt;/p&gt;

    mistral: { workflow: &#x27;IDLE&#x27;, action: &#x27;—&#x27;, waiting: false },
    counts: { fence: 0, evacuate: 0, powerOn: 0 }
  };
  for (const [key, values] of Object.entries(patch)) state[key] = { ...state[key], ...values };
  return state;
}

function compositeSignal(from, to, kind, label, options = {}) {
  return { from, to, kind, label, via: [], lost: false, ...options };
}

function compositeLocal(actor, label, localType = &#x27;check&#x27;, folded) {
  return compositeSignal(actor, actor, &#x27;observation&#x27;, label, { localType, ...(folded ? { folded } : {}) });
}

function compositeBuilder(mode, patch = {}) {
  let state = compositeState(patch);
  const frames = [];
  const add = (id, title, detail, delta = {}, signal = null, extra = {}) =&gt; {
    for (const [key, values] of Object.entries(delta)) state[key] = { ...state[key], ...values };
    frames.push({ id: `${mode}-${id}`, title, detail, state: structuredClone(state), signal, ...extra });
  };
  const acquire = (prefix, actor, owner, action) =&gt; {
    add(`${prefix}-request`, &#x27;Запрошен host lock&#x27;, `PowerOps и Tooz работают внутри ${owner}. Общие backend, namespace и каноническое имя Hsrc задают один lock. ${action}`,
      { host: { heartbeat: true, view: &#x27;acquire ожидается&#x27; } }, compositeSignal(actor, &#x27;etcd&#x27;, &#x27;command&#x27;, &#x27;Tooz: acquire host/Hsrc&#x27;));
    add(`${prefix}-acquired`, &#x27;Host lock получен&#x27;, &#x27;Backend вернул успешный acquire. Следом нужна проверка heartbeat и UUID владения; UUID lock не равен ID notification/action.&#x27;,
      { host: { owner, confirmed: false, view: &#x27;получен; UUID ещё не проверен&#x27; } }, compositeSignal(&#x27;etcd&#x27;, actor, &#x27;observation&#x27;, &#x27;acquire: успешно&#x27;));
    add(`${prefix}-check`, &#x27;Проверяется владение&#x27;, &#x27;assert_healthy() проверяет heartbeat thread и соответствие значения ключа UUID текущего lock.&#x27;,
      {}, compositeSignal(actor, &#x27;etcd&#x27;, &#x27;command&#x27;, &#x27;Tooz: UUID-check&#x27;));
    add(`${prefix}-confirmed`, &#x27;Владение подтверждено&#x27;, &#x27;Успешная проверка разрешает следующий шаг. Проверка lock и внешний API-вызов не составляют одну атомарную транзакцию.&#x27;,
      { host: { confirmed: true, view: &#x27;UUID подтверждён; heartbeat жив&#x27; }, ...(owner === &#x27;Masakari&#x27; ? { protocol: { phase: &#x27;RECOVERY_ADMITTED&#x27; } } : {}) }, compositeSignal(&#x27;etcd&#x27;, actor, &#x27;observation&#x27;, &#x27;host UUID: OK&#x27;));
  };
  const release = (prefix, actor, detail, delta = {}) =&gt; {
    add(`${prefix}-request`, &#x27;Освобождение host lock&#x27;, detail, {}, compositeSignal(actor, &#x27;etcd&#x27;, &#x27;command&#x27;, &#x27;Tooz: release host/Hsrc&#x27;));
    add(`${prefix}-confirmed`, &#x27;Host lock освобождён&#x27;, &#x27;Release успешен, coordinator завершён, heartbeat остановлен. Освобождение lock не отменяет отправленные внешние команды.&#x27;,
      { ...delta, host: { owner: &#x27;none&#x27;, confirmed: false, heartbeat: false, view: &#x27;освобождён&#x27; } }, compositeSignal(&#x27;etcd&#x27;, actor, &#x27;observation&#x27;, &#x27;release: успешно&#x27;));
  };
  const powerRoute = (prefix, target) =&gt; {
    add(`${prefix}-conductor`, &#x27;Ironic API передаёт команду conductor&#x27;, &#x27;Команда для точного Ironic Node Hsrc передаётся обслуживающему conductor. Принятие команды ещё не меняет физическое питание.&#x27;,
      {}, compositeSignal(&#x27;ironic&#x27;, &#x27;ironicConductor&#x27;, &#x27;command&#x27;, `RPC: power-${target} Hsrc`));
    add(`${prefix}-bmc`, &#x27;Ironic conductor обращается к BMC Hsrc&#x27;, &#x27;Драйвер conductor отправляет power target через настроенный Redfish либо IPMI. BMC управляет питанием независимо от nova-compute и ОС источника.&#x27;,
      {}, compositeSignal(&#x27;ironicConductor&#x27;, &#x27;sourceBmc&#x27;, &#x27;command&#x27;, `Redfish / IPMI: power-${target}`));
  };
  const finish = (contract, assumptions = []) =&gt; ({
    id: `COMPOSITE-${mode.toUpperCase()}`,
    profile: &#x27;Архивы + mimaric · PowerOps + Watcher guard + evacuation guard&#x27;,
    contract,
    assumptions: [
      &#x27;Иллюстрация по исходникам: совместимая сборка и deployment не подтверждены.&#x27;,
      &#x27;PowerOps и оба guard предполагаются включёнными; общий etcd и canonical host Hsrc.&#x27;,
      &#x27;Namespaces и согласованные настройки подготовлены. Начальный READY Watcher предполагает ранее выполненный оператором resume; initialize сам создаёт BLOCKED.&#x27;,
      &#x27;E0/E1 — условные обозначения UUID epoch Watcher, не числовой счётчик. Новый incident меняет epoch; повтор того же incident идемпотентен.&#x27;,
      &#x27;all_down; три включённые сети manage/tenant/storage с masakari_monitor; recovery method=auto. Независимость их отказов не предполагается.&#x27;,
      &#x27;Admission: max_parallel=3, один receiving ComputeNode UUID за раз; cooldown=5 с. Время анимации условное.&#x27;,
      &#x27;Guard встроен в Masakari/Nova, PowerOps/Tooz — в Masakari/Mistral; отдельных daemon нет.&#x27;,
      &#x27;Hdst nova-compute enabled/up — начальное условие, его отдельное API-чтение не моделируется. Последнее чтение ВМ может отставать от физического мира.&#x27;,
      &#x27;Power command раскрыт как Ironic API → conductor → BMC Hsrc → физическое питание; обратные проверки conductor/BMC при polling свёрнуты в readback Ironic API.&#x27;,
      ...assumptions
    ],
    frames
  });
  return { add, acquire, release, powerRoute, finish };
}

function buildCompositeRecovery(mode) {
  const { add, acquire, release, powerRoute, finish } = compositeBuilder(mode);
  add(&#x27;init&#x27;, &#x27;Одна ВМ на источнике&#x27;, &#x27;v0 работает на Hsrc; на Hdst экземпляра нет. Mistral исполняет отдельные плановые workflows и не входит в аварийный TaskFlow.&#x27;);

  add(&#x27;network-loss&#x27;, mode === &#x27;hold&#x27; ? &#x27;Потеря одной сети&#x27; : &#x27;Потеря трёх наблюдаемых сетей&#x27;, &#x27;Изменилась доступность Hsrc в сетях Consul. Это потеря наблюдаемой связи, а не уведомление от отказавшего хоста. Потеря связи не доказывает остановку ВМ: v0 всё ещё работает.&#x27;,
    { world: { networks } }, compositeSignal(&#x27;sourceConsul&#x27;, &#x27;detector&#x27;, &#x27;loss&#x27;, networks, { lost: true, folded: &#x27;Consul gossip и чтение локальных endpoints на control свёрнуты.&#x27; }));
  add(&#x27;network-observation&#x27;, &#x27;Детектор обновил наблюдения&#x27;, `Эффективный набор содержит три сети: ${networks}. Политика all_down проверяется по этому набору.`,
    { knowledge: { networks }, protocol: { phase: &#x27;SUSPECTED&#x27; } }, compositeLocal(&#x27;detector&#x27;, &#x27;Проверка all_down&#x27;));
  if (mode === &#x27;hold&#x27;) {

      { protocol: { phase: &#x27;POLICY_HOLD&#x27; } }, compositeLocal(&#x27;detector&#x27;, &#x27;POLICY_HOLD&#x27;));

    { knowledge: { vmHost: &#x27;Hdst&#x27;, vmState: &#x27;ACTIVE&#x27; } }, compositeSignal(&#x27;nova&#x27;, &#x27;controller&#x27;, &#x27;observation&#x27;, &#x27;Hdst · ACTIVE · task=None&#x27;));

  add(&#x27;masakari-final-nova-read&#x27;, &#x27;Заключительная проверка Nova&#x27;, &#x27;После ожидания Masakari заново получает ВМ и проверяет назначение, vm_state и task_state перед VMove SUCCEEDED.&#x27;,

  release(&#x27;host-release&#x27;, &#x27;controller&#x27;, &#x27;Recovery завершён; освобождается host lock Hsrc. Источник остаётся Off, Watcher BLOCKED; автоматического power-on или resume нет.&#x27;);

      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;

      .catch(() =&gt; {

          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }

  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }

    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {

      return;
    }

    const trigger = getTrigger(event.target);

      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }

  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }

  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
